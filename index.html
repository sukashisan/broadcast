<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>文化祭案内システム</title>
    <style>
    :root{
      --bg:#0f172a;
      --card:#1e293b;
      --item:#334155;
      --green:#22c55e;
      --green-dark:#16a34a;
      --red:#ef4444;
      --red-dark:#dc2626;
      --blue:#3b82f6;
      --text:#ffffff;
      --sub:#94a3b8;
      --radius:18px;
    }
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }
    body{
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:var(--text);
      font-family:Noto Sans JP;
      padding:20px;
      min-height:100vh;
    }
    .container{
      max-width:900px;
      margin:auto;
    }
    a {
      text-decoration: none;
      color: inherit;
      transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }
    p{
      text-align:center;
      margin-bottom:16px;
      font-size:clamp(1.8rem,4vw,2.6rem);
      font-weight:350;
    }
    .card{
      background:var(--card);
      border-radius:var(--radius);
      padding:24px;
      margin-bottom:20px;
      box-shadow:0 8px 25px rgba(0,0,0,.25);
    }
    .card p{
      font-size:1.6rem;
      font-weight:400;
      margin-left:12px;
      text-align:left;
    }
    h2{
      margin-bottom:15px;
      font-size:1.2rem;
    }

    /* ===== ステータス ===== */
    .status{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:20px;
      font-size:1.6rem;
      font-weight:400;
    }
    #statusIcon{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:50px;
      height:50px;
      border-radius:50%;
    }
    .playing #statusIcon{
      background:rgba(34,197,94,.2);
      animation:pulse 1.5s infinite;
    }

    @keyframes pulse{
      0%{ transform:scale(1); }
     50%{ transform:scale(1.15); }
    100%{ transform:scale(1); }
    }

    /* ===== ボタン ===== */
    .buttons{
      display:flex;
      gap:12px;
    }
    button{
      border:none;
      border-radius:12px;
      padding:14px 20px;
      font-size:1rem;
      font-weight:bold;
      cursor:pointer;
      transition:.2s;
    }
    button:hover{
      transform:translateY(-2px);
    }
    button:active{
      transform:scale(.97);
    }
    .start{
      flex:1;
      background:var(--green-dark);
      color:white;
    }
    .stop{
      flex:1;
      background:var(--red-dark);
      color:white;
    }
    .add{
      background:var(--blue);
      color:white;
      width:90px;
    }
    .remove{
      background:var(--red);
      color:white;
      width:90px;
    }

    /* ===== 現在再生中 ===== */
    .current{
      margin-top:18px;
      padding:14px;
      border-radius:10px;
      background:#0f172a;
      color:#38bdf8;
      font-size:1rem;
    }
    #currentAudio{
      font-weight:bold;
    }

    /* ===== セレクトボックス ===== */
    select{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      font-size:1rem;
      background:white;
      color:black;
    }

    /* ===== 放送内容 ===== */
    .item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      background:var(--item);
      border-radius:12px;
      padding:16px;
      margin-bottom:10px;
    }
    .item:hover{
      background:#475569;
    }
    .item-info{
      flex:1;
    }
    .item-title{
      font-weight:bold;
      margin-bottom:4px;
    }
    .note{
      font-size:.8rem;
      color:var(--sub);
    }

    /* ===== スマホ対応 ===== */
    @media(max-width:700px){
      body{
        padding:12px;
      }
      .card{
        padding:18px;
      }
      .card p{
        font-size:1.3rem;
      }
      .buttons{
        flex-direction:column;
      }
      .item{
        flex-direction:column;
        align-items:flex-start;
      }
      .add,
      .remove{
        width:100%;
      }
      .status{
        font-size:1.3rem;
      }
    }
    </style>
  </head>

  <body>
    <div class="container">
      <p>音声案内</p>
      <a href="howto.pdf">使い方はこちら</a>
      <div class="card">
        <div class="status">
          <span id="statusIcon">🔴</span>
          <span id="statusText">停止中</span>
        </div>
        <div class="buttons">
          <button id="startBtn" class="start">
          ▶ 再生
          </button>
          <button id="stopBtn" class="stop">
          ■ 停止
          </button>
        </div>
        <div class="current">
        内容：
          <span id="currentAudio"></span>
        </div>
      </div>
      <div class="card">
        <p>待ち時間</p>
        <select id="waitTime">
          <option value="0">0分</option>
          <option value="5">5分</option>
          <option value="10">10分</option>
          <option value="15">15分</option>
          <option value="20">20分</option>
        </select>
      </div>
      <div class="card">
        <p>放送の追加</p>
        <div id="announcementList"></div>
      </div>
    </div>
    <audio id="player"></audio>

    <script>
    const ANNOUNCEMENTS = [
      {id:"queue",
       name:"窓側整列",
       enabled:true
       }
    ];
    let running = false;
    let playlist = [];
    let currentIndex = 0;
    const player =
      document.getElementById("player");
    const waitTime =
      document.getElementById("waitTime");
    const statusIcon =
      document.getElementById("statusIcon");
    const statusText =
      document.getElementById("statusText");
    const currentAudio =
      document.getElementById("currentAudio");
    const announcementList =
      document.getElementById("announcementList");
    const storedAnnouncements =
      localStorage.getItem("announcements");
    if(storedAnnouncements){
      const saved =
        JSON.parse(storedAnnouncements);
    ANNOUNCEMENTS.forEach(item=>{
      const found =
        saved.find(x=>x.id===item.id);
        if(found){
          item.enabled =
            found.enabled;
        }
      });
    }
    const storedWait =
      localStorage.getItem("waitTime");
      if(storedWait){
        waitTime.value =
          storedWait;
      }
      function saveSettings(){
        localStorage.setItem("announcements",JSON.stringify(ANNOUNCEMENTS));
        localStorage.setItem("waitTime",waitTime.value);
      }
      function renderAnnouncements(){
        announcementList.innerHTML = "";
    ANNOUNCEMENTS.forEach(item=>{
      const row =
        document.createElement("div");
        row.className = "item";
        row.innerHTML = `
          <div>
            <div>${item.name}</div>
              <div class="note">
                待ち時間0分では再生されません
              </div>
            </div>
        `;
        const btn =
        document.createElement("button");
        if(item.enabled){
          btn.textContent = "削除";
          btn.className = "remove";
          btn.onclick = ()=>{
            item.enabled = false;
            saveSettings();
            renderAnnouncements();
          };
        }else{
          btn.textContent = "追加";
          btn.className = "add";
          btn.onclick = ()=>{
            item.enabled = true;
            saveSettings();
            renderAnnouncements();
          };
        }
        row.appendChild(btn);
        announcementList.appendChild(row);
      });
    }
    function buildPlaylist(){
      playlist = [
        {
         name:"アメリカンカジノはいかがですか？",
         file:"audio/introduce1.wav"
      },
      {
         name:"ポーカーとブラックジャックで遊べます！",
         file:"audio/introduce2.wav"
      },
      {
         name:"ルールがわからなくても大丈夫です！",
         file:"audio/introduce3.wav"
      }
    ];


    // 0分ならここで終了
    if(waitTime.value === "0"){
        return;
    }
    playlist.push({
        name:"現在の待ち時間は",
        file:"audio/wait.wav"
    });
    const waitMap = {
        "5":"audio/five.wav",
        "10":"audio/ten.wav",
        "15":"audio/fifteen.wav",
        "20":"audio/twenty.wav"
    };
    playlist.push({
        name:`およそ ${waitTime.value}分です`,
        file:waitMap[waitTime.value]
    });
    const queue =
    ANNOUNCEMENTS.find(
        x=>x.id==="queue"
    );
    if(queue?.enabled){
        playlist.push({
            name:"窓側に１列で並んでください",
            file:"audio/que.wav"
        });
      }
    }
    function updateStatus(){
      if(running){
        statusIcon.textContent = "🟢";
        statusText.textContent = "再生中";
      }else{
        statusIcon.textContent = "🔴";
        statusText.textContent = "停止中";
      }
    }
    function playCurrent(){
      if(!running){
        return;
      }
      buildPlaylist();
      if(currentIndex >= playlist.length){
        currentIndex = 0;
      }
      const item =
        playlist[currentIndex];
      currentAudio.textContent =
        item.name;
      player.src =
        item.file;
      player.play().catch(console.error);
    }
    player.addEventListener("ended",()=>{
      currentIndex++;
      if(currentIndex >=playlist.length){
        currentIndex = 0;
      }
      playCurrent();
    });
    document
      .getElementById("startBtn")
      .addEventListener("click",()=>{
        currentIndex = 0;
        running = true;
        updateStatus();
        playCurrent();
      });
      document
        .getElementById("stopBtn")
        .addEventListener("click",()=>{
          running = false;
          player.pause();
          player.currentTime = 0;
            currentAudio.textContent =
              "なし";
            updateStatus();
          });
        waitTime.addEventListener("change",()=>{
          saveSettings();
        }
      );
      renderAnnouncements();
      updateStatus();
   </script>
</body>
</html>
